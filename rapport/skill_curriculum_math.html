// Forward (adj) and backward (radj) adjacency for BFS path-finding.
const adj = {}, radj = {};
NODES_DATA.forEach(n => { adj[n.id] = []; radj[n.id] = []; });
EDGES_DATA.forEach(e => { adj[e.from].push(e.to); radj[e.to].push(e.from); });

function bfs(startId, graph) {
  const visited = new Set([startId]);
  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    (graph[cur] || []).forEach(nb => {
      if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
    });
  }
  return visited;
}

const nodes = new vis.DataSet(
  NODES_DATA.map(n => ({ ...n, fixed: { x: true, y: true } }))
);
const edges = new vis.DataSet(
  EDGES_DATA.map((e, i) => ({
    ...e, id: i,
    arrows: { to: { enabled: true, scaleFactor: 0.8 } },
    smooth: { type: 'curvedCW', roundness: 0.15 },
    width: 1.5,
  }))
);

const network = new vis.Network(
  document.getElementById('network'),
  { nodes, edges },
  {
    physics: false,
    interaction: { hover: true, tooltipDelay: 200 },
    edges: { selectionWidth: 0 },
    nodes: { borderWidth: 1.5 },
  }
);

const DEFAULT_COLORS = {};
NODES_DATA.forEach(n => { DEFAULT_COLORS[n.id] = n.color; });
let activeNode = null;

network.on('click', function(params) {
  if (params.nodes.length > 0) {
    const nid = params.nodes[0];
    if (activeNode === nid) { resetAll(); activeNode = null; return; }
    activeNode = nid;
    const ancestors   = bfs(nid, radj);
    const descendants = bfs(nid, adj);
    const highlighted = new Set([...ancestors, ...descendants]);
    nodes.update(NODES_DATA.map(function(n) {
      if (n.id === nid)
        return { id: n.id, color: { background: '#e74c3c', border: '#c0392b' }, opacity: 1.0 };
      if (ancestors.has(n.id))
        return { id: n.id, color: { background: '#3498db', border: '#2980b9' }, opacity: 1.0 };
      if (descendants.has(n.id))
        return { id: n.id, color: { background: '#2ecc71', border: '#27ae60' }, opacity: 1.0 };
      return { id: n.id, color: { background: '#3a3a4a', border: '#55556a' }, opacity: 0.25 };
    }));
    edges.update(EDGES_DATA.map(function(e, i) {
      const active = highlighted.has(e.from) && highlighted.has(e.to);
      return {
        id: i,
        color: { color: active ? '#ffffff' : '#333344', opacity: active ? 1.0 : 0.08 },
        width: active ? 2.5 : 1.0,
      };
    }));
  } else {
    resetAll();
    activeNode = null;
  }
});

function resetAll() {
  nodes.update(NODES_DATA.map(function(n) {
    return { id: n.id, color: DEFAULT_COLORS[n.id], opacity: 1.0 };
  }));
  edges.update(EDGES_DATA.map(function(e, i) {
    return { id: i, color: { color: '#aaaaaa', opacity: 0.85 }, width: 1.5 };
  }));
}
